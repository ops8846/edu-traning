<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif"><rect width="760" height="356" rx="10" fill="#ffffff"/><text x="30" y="32" font-size="19" font-weight="700" fill="#1d241f">근무 상태(Duty Status) 전환</text><rect x="30" y="90" width="180" height="80" rx="10" fill="#6b7a72"/><text x="120.0" y="128.0" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">Off Duty</text><text x="120.0" y="150.0" font-size="13" text-anchor="middle" fill="#fff">비근무</text><rect x="30" y="230" width="180" height="80" rx="10" fill="#8a96a0"/><text x="120.0" y="268.0" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">Sleeper Berth</text><text x="120.0" y="290.0" font-size="13" text-anchor="middle" fill="#fff">해당 없음</text><rect x="290" y="90" width="200" height="80" rx="10" fill="#1f7e8c"/><text x="390.0" y="128.0" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">On Duty</text><text x="390.0" y="150.0" font-size="13" text-anchor="middle" fill="#fff">(Not Driving)</text><rect x="570" y="90" width="160" height="80" rx="10" fill="#1f7350"/><text x="650.0" y="128.0" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">Driving</text><text x="650.0" y="150.0" font-size="13" text-anchor="middle" fill="#fff">운전 중</text><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d241f"/></marker></defs><line x1="290" y1="130" x2="214" y2="130" stroke="#1d241f" stroke-width="2.5" marker-end="url(#ah)"/><text x="252" y="56" font-size="13" text-anchor="middle" fill="#1d241f">직접 선택</text><text x="252" y="72" font-size="13" text-anchor="middle" fill="#1d241f">(On Duty에서만)</text><line x1="568" y1="112" x2="494" y2="112" stroke="#1d241f" stroke-width="2.5" marker-end="url(#ah)"/><text x="530" y="66" font-size="13" text-anchor="middle" fill="#1d241f">차량이 5분 이상</text><text x="530" y="82" font-size="13" text-anchor="middle" fill="#1d241f">정지하면 자동</text><line x1="494" y1="150" x2="566" y2="150" stroke="#1d241f" stroke-width="2.5" marker-end="url(#ah)"/><text x="530" y="188" font-size="13" text-anchor="middle" fill="#1d241f">주행이 감지되면 자동</text><text x="230" y="262" font-size="14" fill="#1d241f">Off Duty와 Sleeper Berth는</text><text x="230" y="282" font-size="14" fill="#1d241f">직접 눌러서 전환합니다.</text><text x="30" y="340" font-size="13" fill="#4d5348">※ 자동 전환(Auto-Duty): 5분 이상 정지 → On Duty (Not Driving), 주행 감지 → Driving</text></svg>
